<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — AI-Assisted Medical Research Preprints</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<style>
body{font-family:Helvetica,Arial,sans-serif;max-width:720px;margin:0 auto;padding:2.5rem 1.2rem;color:#1a1a1a;background:#fbfaf7;line-height:1.6}
h1{font-size:1.5rem;border-bottom:2px solid #8a2b2b;padding-bottom:.4rem}
label{display:block;font-weight:600;font-size:.85rem;margin:.8rem 0 .2rem}
input{width:100%;padding:.5rem;border:1px solid #ccc;border-radius:5px;font-size:.95rem;box-sizing:border-box}
button{background:#1f4e79;color:#fff;border:0;padding:.6rem 1.2rem;border-radius:5px;font-size:.95rem;margin-top:1rem;cursor:pointer}
#msg{margin-top:.8rem;font-size:.9rem}
a{color:#1f4e79}
</style>
</head>
<body>
<div id="nav"></div>
<h1>Log in</h1>
<form id="login">
<label>Email *</label><input name="email" type="email" required>
<label>Password *</label><input name="password" type="password" required>
<button type="submit">Log in</button>
<div id="msg"></div>
</form>
<p>No account yet? <a href="/signup.html">Create one</a>.</p>
<script>
(async()=>{
  await Auth.injectNav();
  // If ?next= is present (set by requireLogin), remember it for the redirect.
  document.getElementById("login").addEventListener("submit",async e=>{
    e.preventDefault();
    const m=document.getElementById("msg");
    const f=Object.fromEntries(new FormData(e.target).entries());
    m.style.color="#1a1a1a";m.textContent="Logging in…";
    const {error}=await Auth.sb.auth.signInWithPassword({email:f.email.trim(),password:f.password});
    if(error){m.style.color="#8a2b2b";m.textContent="Login failed: "+error.message;return;}
    const next=new URLSearchParams(window.location.search).get("next");
    window.location.href=next||"/dashboard.html";
  });
})();
</script>
</body></html>
